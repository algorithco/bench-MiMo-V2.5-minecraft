<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Clone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="blocker">
    <div class="msg">
      [ Minecraft Clone ]<br><br>
      Click to play<br>
      WASD = Move | Mouse = Look | Space = Jump<br>
      Left Click = Mine | Right Click = Place<br>
      1-5 = Select Block | Scroll = Cycle<br>
      Shift = Sprint | T = Chat | F = Fly
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="hotbar"></div>
  <div id="death-screen">
    <h1>You Died!</h1>
    <p id="death-msg">Fell into the void</p>
    <button id="respawn-btn">Respawn</button>
  </div>
  <div id="gamemode-display">survival</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/world/noise.js"></script>
  <script src="js/world/terrain.js"></script>
  <script src="js/world/chunks.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/rendering/textures.js"></script>
  <script src="js/rendering/meshes.js"></script>
  <script src="js/rendering/particles.js"></script>
  <script src="js/rendering/sky.js"></script>
  <script src="js/audio/sounds.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/chat.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
